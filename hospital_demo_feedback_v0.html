<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>콩케어 데모 피드백</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#f7f8fb;color:#111827;margin:0}
.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #d1d5db;border-radius:18px;padding:18px}
h1{font-size:1.5rem}.note{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px}
label{display:block;font-weight:800;margin:16px 0 6px}select,textarea,button{width:100%;font:inherit;padding:14px;border:1px solid #cbd5e1;border-radius:12px}
textarea{min-height:100px}button{margin-top:16px;background:#0f62fe;color:white;font-weight:900;min-height:54px}
.small{font-size:.9rem;color:#475569;line-height:1.5}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>콩케어 데모 의견 보내기</h1>
<div class="note"><b>개인정보를 적지 마세요.</b><br>이름, 전화번호, 주민번호, 상세 병력은 받지 않습니다.</div>
<label for="task">무엇을 찾으셨나요?</label>
<select id="task"><option>복지/현금지원</option><option>투석·신장</option><option>교통</option><option>의료비</option><option>긴급지원</option><option>기타</option></select>
<label for="success">원하는 내용을 찾을 수 있었나요?</label>
<select id="success"><option>예</option><option>아니오</option><option>일부만</option></select>
<label for="issue">가장 불편한 점은?</label>
<select id="issue"><option>없음</option><option>글씨/버튼</option><option>용어가 어려움</option><option>찾기 어려움</option><option>정보가 부족함</option><option>정책이 틀린 것 같음</option><option>링크 문제</option><option>기타</option></select>
<label for="memo">짧은 의견 (선택)</label>
<textarea id="memo" placeholder="개인정보 없이 적어주세요"></textarea>
<p class="small">이 화면은 데모 단계이며, 실제 제출 연결 전에는 데이터가 외부로 전송되지 않는 내부 테스트 폼으로 사용합니다.</p>
<button type="button" onclick="alert('데모 단계: 의견 구조만 확인합니다. 실제 수집 연결은 승인 후 활성화합니다.')">의견 보내기</button>
</div></div>
</body></html>
